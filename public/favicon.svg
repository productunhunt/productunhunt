<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Cheap gold, struck through: the mark for a product that was considered
         and then not built. Deliberately blunt, because the useful size is 16px. -->
    <rect x="10" y="10" width="108" height="108" rx="12" fill="#916a0b" />
    <path d="M34 94 94 34" stroke="#fcfcfa" stroke-width="16" stroke-linecap="square" />
    <style>
        /* The strike reads as a hole punched through the mark, so it tracks the
           browser chrome's background rather than staying paper-white. */
        @media (prefers-color-scheme: dark) {
            rect { fill: #e7bf57; }
            path { stroke: #0f1215; }
        }
    </style>
</svg>
